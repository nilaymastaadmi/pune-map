<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Pune Map</title>

<!-- PWA: installable, offline-capable -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pune Map">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Leaflet-Geoman (draw + edit paths) -->
<link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.css">
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.js"></script>

<style>
  :root {
    --bg: #1e1e24;
    --panel: #26262e;
    --panel-2: #2f2f3a;
    --accent: #4f8cff;
    --home: #34c759;
    --work: #ff9f0a;
    --checkpoint: #ff453a;
    --text: #e8e8ea;
    --muted: #9a9aa8;
    --border: #3a3a46;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; overflow: hidden; background: var(--bg); color: #e8e8ea; }

  #map { flex: 1; height: 100vh; background: #ddd; }

  #sidebar {
    width: 320px; height: 100vh; background: var(--panel);
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
    box-shadow: -2px 0 12px rgba(0,0,0,0.3); z-index: 1000;
  }
  #sidebar header {
    padding: 16px; border-bottom: 1px solid var(--border);
  }
  #sidebar header h1 { margin: 0; font-size: 18px; letter-spacing: -0.3px; }
  #sidebar header p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

  .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px; }
  .toolbar button {
    border: 1px solid var(--border); background: var(--panel-2); color: #e8e8ea;
    padding: 9px 8px; border-radius: 8px; font-size: 12.5px; cursor: pointer;
    display: flex; align-items: center; gap: 6px; justify-content: center; transition: .12s;
  }
  .toolbar button:hover { background: #3a3a48; }
  .toolbar button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbar button .dot { width: 9px; height: 9px; border-radius: 50%; }

  .content { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
  .section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
    margin: 18px 0 8px; font-weight: 600;
  }
  .item {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 10px; margin-bottom: 7px; font-size: 13px;
  }
  .item .row { display: flex; align-items: center; gap: 8px; }
  .item .name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .item .actions { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
  .item .actions button {
    border: none; background: #3a3a48; color: #d8d8e0; font-size: 11px; padding: 4px 8px;
    border-radius: 6px; cursor: pointer;
  }
  .item .actions button:hover { background: #474758; }
  .item .actions button.nav { background: var(--accent); color: #fff; }
  .item .actions button.del { background: transparent; color: var(--checkpoint); }
  .badge { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .empty { color: var(--muted); font-size: 12px; font-style: italic; padding: 4px 0; }

  .footer { border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 8px; }
  .footer button {
    flex: 1; border: 1px solid var(--border); background: var(--panel-2); color: #d8d8e0;
    padding: 8px; border-radius: 8px; font-size: 12px; cursor: pointer;
  }
  .footer button:hover { background: #3a3a48; }

  .stats { display: flex; gap: 12px; padding: 0 16px 4px; font-size: 12px; color: var(--muted); }
  .stats b { color: #e8e8ea; }

  .trackbar { padding: 4px 16px 10px; display: flex; gap: 8px; align-items: center; }
  #btn-track {
    flex: 1; padding: 12px; border-radius: 10px; border: none; background: var(--home);
    color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: .15s;
  }
  #btn-track:hover { filter: brightness(1.08); }
  #btn-track.recording { background: var(--checkpoint); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .65; } }
  #track-status { font-size: 11.5px; color: var(--muted); white-space: nowrap; min-width: 90px; text-align: right; }

  .hint {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(20,20,26,.92); color: #fff; padding: 8px 16px; border-radius: 20px;
    font-size: 13px; z-index: 1001; display: none; box-shadow: 0 2px 10px rgba(0,0,0,.4);
  }
  .leaflet-popup-content { font-size: 13px; }
  .leaflet-popup-content button {
    display: block; width: 100%; margin: 4px 0 0; padding: 6px; border: none;
    border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; font-size: 12px;
  }
  .leaflet-popup-content button.secondary { background: #555; }
  .leaflet-popup-content input { width: 100%; padding: 5px; margin-top: 4px; box-sizing: border-box; }
</style>
</head>
<body>

<div id="map"></div>
<div class="hint" id="hint"></div>

<div id="sidebar">
  <header>
    <h1>🗺️ My Pune Map</h1>
    <p>Track roads you've taken · save places · route in Maps</p>
  </header>

  <div class="toolbar">
    <button id="btn-draw"><span class="dot" style="background:var(--accent)"></span>Draw road</button>
    <button id="btn-edit">✏️ Edit mode</button>
    <button id="btn-checkpoint"><span class="dot" style="background:var(--checkpoint)"></span>Checkpoint</button>
    <button id="btn-home"><span class="dot" style="background:var(--home)"></span>Set Home</button>
    <button id="btn-work"><span class="dot" style="background:var(--work)"></span>Set Work</button>
    <button id="btn-route">🚗 Home→Work</button>
  </div>

  <div class="trackbar">
    <button id="btn-track">▶ Start tracking</button>
    <span id="track-status"></span>
  </div>

  <div class="stats">
    <span>Roads: <b id="stat-roads">0</b></span>
    <span>Distance: <b id="stat-dist">0 km</b></span>
    <span>Places: <b id="stat-places">0</b></span>
  </div>

  <div class="content">
    <div class="section">
      <h2>Saved Places</h2>
      <div id="list-places"></div>
    </div>
    <div class="section">
      <h2>Checkpoints</h2>
      <div id="list-checkpoints"></div>
    </div>
    <div class="section">
      <h2>Roads Taken</h2>
      <div id="list-roads"></div>
    </div>
  </div>

  <div class="footer">
    <button id="btn-export">⬇ Export</button>
    <button id="btn-import">⬆ Import</button>
    <button id="btn-locate">📍 Locate me</button>
  </div>
</div>

<input type="file" id="file-input" accept=".json" style="display:none">

<script>
// ---------- State & storage ----------
const STORAGE_KEY = 'pune-map-data-v1';
let data = load() || { roads: [], checkpoints: [], places: [] };
let idCounter = Date.now();
const uid = () => (++idCounter).toString(36);

function load() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch { return null; }
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  render();
}

// ---------- Map ----------
const PUNE = [18.5204, 73.8567];
// preferCanvas: render roads/markers on one <canvas> instead of many SVG/DOM
// nodes — far lighter on old phones once you have lots of tracked roads.
const map = L.map('map', { zoomControl: true, preferCanvas: true }).setView(PUNE, 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap contributors',
  updateWhenIdle: true,   // don't fetch tiles mid-pan — fewer requests, less jank
  keepBuffer: 2           // smaller offscreen tile buffer = less memory
}).addTo(map);

// Layer registries: id -> leaflet layer
const roadLayers = {};
const markerLayers = {};

// ---------- Geoman setup (path drawing only) ----------
map.pm.setGlobalOptions({ snappable: true, snapDistance: 18 });
map.pm.setPathOptions({ color: '#4f8cff', weight: 5, opacity: 0.85 });

// When a new polyline is drawn
map.pm.removeControls(); // we use our own buttons
map.on('pm:create', (e) => {
  if (e.shape !== 'Line') { e.layer.remove(); return; }
  const name = prompt('Name this road / route:', 'Route ' + (data.roads.length + 1));
  const road = {
    id: uid(),
    name: name || ('Route ' + (data.roads.length + 1)),
    latlngs: e.layer.getLatLngs().map(p => [p.lat, p.lng]),
    color: '#4f8cff',
    date: new Date().toISOString().slice(0, 10)
  };
  e.layer.remove(); // remove temp, re-add managed version
  data.roads.push(road);
  addRoadLayer(road);
  save();
  setMode(null);
});

function addRoadLayer(road) {
  const line = L.polyline(road.latlngs, { color: road.color, weight: 5, opacity: 0.85 });
  line.bindPopup(`<b>${esc(road.name)}</b><br><span style="color:#888">${road.date} · ${roadKm(road).toFixed(2)} km</span>`);
  line.on('pm:edit', () => {
    road.latlngs = line.getLatLngs().map(p => [p.lat, p.lng]);
    save();
  });
  line.addTo(map);
  roadLayers[road.id] = line;
}

// ---------- Markers (checkpoints + places) ----------
function placeIcon(color, emoji) {
  return L.divIcon({
    className: 'custom-pin',
    html: `<div style="background:${color};width:26px;height:26px;border-radius:50% 50% 50% 0;
           transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.4);
           display:flex;align-items:center;justify-content:center;">
           <span style="transform:rotate(45deg);font-size:13px;">${emoji}</span></div>`,
    iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -26]
  });
}
const ICONS = {
  home: () => placeIcon('#34c759', '🏠'),
  work: () => placeIcon('#ff9f0a', '💼'),
  custom: () => placeIcon('#4f8cff', '⭐'),
  checkpoint: () => placeIcon('#ff453a', '📍')
};

function addPlaceLayer(p) {
  const m = L.marker([p.lat, p.lng], { icon: ICONS[p.type] ? ICONS[p.type]() : ICONS.custom() }).addTo(map);
  m.bindPopup(placePopup(p));
  markerLayers[p.id] = m;
}
function addCheckpointLayer(c) {
  const m = L.marker([c.lat, c.lng], { icon: ICONS.checkpoint() }).addTo(map);
  m.bindPopup(checkpointPopup(c));
  markerLayers[c.id] = m;
}

function placePopup(p) {
  const d = `<b>${esc(p.label)}</b><br><span style="color:#888;font-size:11px">${p.type}</span>`;
  const el = document.createElement('div');
  el.innerHTML = d;
  el.appendChild(navButtons({ lat: p.lat, lng: p.lng }, p.id));
  return el;
}
function checkpointPopup(c) {
  const el = document.createElement('div');
  el.innerHTML = `<b>${esc(c.name)}</b>${c.notes ? '<br><span style="font-size:11px;color:#888">' + esc(c.notes) + '</span>' : ''}`;
  el.appendChild(navButtons({ lat: c.lat, lng: c.lng }, c.id));
  return el;
}

function navButtons(dest, id) {
  const wrap = document.createElement('div');
  const home = data.places.find(p => p.type === 'home');
  const work = data.places.find(p => p.type === 'work');

  const b1 = document.createElement('button');
  b1.textContent = '🚗 Directions here';
  b1.onclick = () => gmaps(null, dest);
  wrap.appendChild(b1);

  if (home) {
    const b = document.createElement('button'); b.className = 'secondary';
    b.textContent = '🏠 From Home'; b.onclick = () => gmaps(home, dest);
    wrap.appendChild(b);
  }
  if (work) {
    const b = document.createElement('button'); b.className = 'secondary';
    b.textContent = '💼 From Work'; b.onclick = () => gmaps(work, dest);
    wrap.appendChild(b);
  }
  return wrap;
}

// ---------- Google Maps routing ----------
function gmaps(origin, dest, mode = 'driving') {
  let url = 'https://www.google.com/maps/dir/?api=1';
  if (origin) url += `&origin=${origin.lat},${origin.lng}`;
  url += `&destination=${dest.lat},${dest.lng}&travelmode=${mode}`;
  window.open(url, '_blank');
}

// ---------- Modes (click-to-place) ----------
let mode = null;
const hint = document.getElementById('hint');
const modeBtns = {
  checkpoint: document.getElementById('btn-checkpoint'),
  home: document.getElementById('btn-home'),
  work: document.getElementById('btn-work'),
  draw: document.getElementById('btn-draw'),
  edit: document.getElementById('btn-edit')
};

function setMode(m) {
  // turn off geoman tools
  map.pm.disableDraw();
  map.pm.disableGlobalEditMode();
  Object.values(modeBtns).forEach(b => b.classList.remove('active'));
  mode = m;
  hint.style.display = 'none';

  if (m === 'draw') {
    modeBtns.draw.classList.add('active');
    map.pm.enableDraw('Line');
    showHint('Click to add points along your road. Double-click to finish.');
  } else if (m === 'edit') {
    modeBtns.edit.classList.add('active');
    map.pm.enableGlobalEditMode();
    showHint('Drag the white handles to reshape roads. Click "Edit mode" again to finish.');
  } else if (m === 'checkpoint' || m === 'home' || m === 'work') {
    modeBtns[m].classList.add('active');
    showHint(`Click on the map to set your ${m === 'checkpoint' ? 'checkpoint' : m}.`);
  }
}
function showHint(t) { hint.textContent = t; hint.style.display = 'block'; }

map.on('click', (e) => {
  if (mode === 'checkpoint') {
    const name = prompt('Checkpoint name:', 'Checkpoint ' + (data.checkpoints.length + 1));
    if (name !== null) {
      const c = { id: uid(), name: name || 'Checkpoint', lat: e.latlng.lat, lng: e.latlng.lng, notes: '' };
      data.checkpoints.push(c); addCheckpointLayer(c); save();
    }
    setMode(null);
  } else if (mode === 'home' || mode === 'work') {
    const existing = data.places.find(p => p.type === mode);
    const label = mode === 'home' ? 'Home' : 'Work';
    if (existing) {
      existing.lat = e.latlng.lat; existing.lng = e.latlng.lng;
      markerLayers[existing.id].setLatLng(e.latlng);
      markerLayers[existing.id].setPopupContent(placePopup(existing));
    } else {
      const p = { id: uid(), label, type: mode, lat: e.latlng.lat, lng: e.latlng.lng };
      data.places.push(p); addPlaceLayer(p);
    }
    save(); setMode(null);
  }
});

// ---------- Toolbar bindings ----------
modeBtns.draw.onclick = () => setMode(mode === 'draw' ? null : 'draw');
modeBtns.edit.onclick = () => setMode(mode === 'edit' ? null : 'edit');
modeBtns.checkpoint.onclick = () => setMode(mode === 'checkpoint' ? null : 'checkpoint');
modeBtns.home.onclick = () => setMode(mode === 'home' ? null : 'home');
modeBtns.work.onclick = () => setMode(mode === 'work' ? null : 'work');

document.getElementById('btn-route').onclick = () => {
  const home = data.places.find(p => p.type === 'home');
  const work = data.places.find(p => p.type === 'work');
  if (!home || !work) { alert('Set both Home and Work first.'); return; }
  gmaps(home, work);
};

document.getElementById('btn-locate').onclick = () => {
  map.locate({ setView: true, maxZoom: 16 });
};
map.on('locationfound', (e) => {
  L.circleMarker(e.latlng, { radius: 7, color: '#fff', fillColor: '#4f8cff', fillOpacity: 1, weight: 2 })
    .addTo(map).bindPopup('You are here').openPopup();
});
map.on('locationerror', () => alert('Could not get your location (needs HTTPS or localhost + permission).'));

// ---------- Live GPS tracking (auto-fill path) ----------
let tracking = false;
let watchId = null;
let trackPts = [];        // [[lat,lng], ...]
let trackLine = null;     // live polyline
let trackMarker = null;   // moving "you" dot
let trackStart = 0;

const btnTrack = document.getElementById('btn-track');
const trackStatus = document.getElementById('track-status');
btnTrack.onclick = () => tracking ? stopTracking() : startTracking();

function startTracking() {
  if (!navigator.geolocation) { alert('Geolocation not supported in this browser.'); return; }
  if (!window.isSecureContext) {
    if (!confirm('GPS needs HTTPS or localhost to work. On file:// the browser will likely block it.\n\nTry anyway?')) return;
  }
  trackPts = [];
  tracking = true;
  trackStart = Date.now();
  btnTrack.textContent = '⏹ Stop tracking';
  btnTrack.classList.add('recording');
  trackLine = L.polyline([], { color: '#ff453a', weight: 5, opacity: 0.9 }).addTo(map);
  trackStatus.textContent = 'acquiring GPS…';
  showHint('📡 Tracking — keep this tab open & in the foreground while you move.');
  watchId = navigator.geolocation.watchPosition(onTrackPos, onTrackErr, {
    enableHighAccuracy: true, maximumAge: 1000, timeout: 20000
  });
}

function onTrackPos(pos) {
  const { latitude, longitude, accuracy } = pos.coords;
  const pt = [latitude, longitude];
  if (!trackMarker) {
    trackMarker = L.circleMarker(pt, { radius: 7, color: '#fff', fillColor: '#ff453a', fillOpacity: 1, weight: 2 }).addTo(map);
    map.setView(pt, 16);
  } else {
    trackMarker.setLatLng(pt);
    // recenter only when you near the screen edge, and without animation —
    // animating a pan on every GPS fix is the main source of jank on old phones.
    if (!map.getBounds().pad(-0.25).contains(pt)) map.panTo(pt, { animate: false });
  }
  // ignore low-accuracy fixes so they don't pollute the path
  if (accuracy > 50) { trackStatus.textContent = `acquiring GPS… ±${Math.round(accuracy)}m`; return; }
  // skip jitter: only record if moved ≥ 8 m from last point
  const last = trackPts[trackPts.length - 1];
  if (last && map.distance(last, pt) < 8) return;
  trackPts.push(pt);
  trackLine.addLatLng(pt);   // append one point — cheaper than rebuilding the whole line
  let km = 0;
  for (let i = 1; i < trackPts.length; i++) km += map.distance(trackPts[i - 1], trackPts[i]);
  const mins = Math.round((Date.now() - trackStart) / 60000);
  trackStatus.textContent = `● ${(km / 1000).toFixed(2)} km · ${mins} min`;
}

function onTrackErr(e) {
  trackStatus.textContent = 'GPS error';
  if (e.code === 1) alert('Location permission denied. Allow location access and try again.');
}

function stopTracking() {
  tracking = false;
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  btnTrack.textContent = '▶ Start tracking';
  btnTrack.classList.remove('recording');
  hint.style.display = 'none';
  if (trackMarker) { trackMarker.remove(); trackMarker = null; }
  if (trackLine) { trackLine.remove(); trackLine = null; }
  if (trackPts.length < 2) { alert('Not enough movement was recorded to save a road.'); trackPts = []; trackStatus.textContent = ''; return; }
  const name = prompt('Save this tracked route as:', 'Trip ' + new Date().toISOString().slice(0, 10));
  if (name === null) { trackPts = []; trackStatus.textContent = ''; return; }
  const road = {
    id: uid(),
    name: name || 'Tracked trip',
    latlngs: trackPts.slice(),
    color: '#ff453a',
    date: new Date().toISOString().slice(0, 10),
    tracked: true
  };
  data.roads.push(road);
  addRoadLayer(road);
  save();
  trackPts = [];
  trackStatus.textContent = '';
}

// ---------- Export / Import ----------
document.getElementById('btn-export').onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pune-map-backup.json';
  a.click();
};
document.getElementById('btn-import').onclick = () => document.getElementById('file-input').click();
document.getElementById('file-input').onchange = (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!imported.roads || !imported.checkpoints || !imported.places) throw new Error('bad file');
      data = imported;
      reloadAll();
      save();
    } catch { alert('Invalid backup file.'); }
  };
  reader.readAsText(file);
  ev.target.value = '';
};

// ---------- Sidebar lists ----------
function render() {
  document.getElementById('stat-roads').textContent = data.roads.length;
  document.getElementById('stat-places').textContent = data.places.length + data.checkpoints.length;
  const totalKm = data.roads.reduce((s, r) => s + roadKm(r), 0);
  document.getElementById('stat-dist').textContent = totalKm.toFixed(1) + ' km';

  renderPlaces();
  renderCheckpoints();
  renderRoads();
}

function renderPlaces() {
  const el = document.getElementById('list-places');
  if (!data.places.length) { el.innerHTML = '<div class="empty">No saved places yet. Use “Set Home / Work”.</div>'; return; }
  el.innerHTML = '';
  data.places.forEach(p => {
    const color = p.type === 'home' ? 'var(--home)' : p.type === 'work' ? 'var(--work)' : 'var(--accent)';
    const div = document.createElement('div'); div.className = 'item';
    div.innerHTML = `<div class="row"><span class="badge" style="background:${color}"></span>
      <span class="name">${esc(p.label)}</span></div>`;
    const actions = document.createElement('div'); actions.className = 'actions';
    actions.appendChild(mkBtn('Show', 'nav', () => focusMarker(p.id)));
    actions.appendChild(mkBtn('Directions', '', () => gmaps(null, p)));
    actions.appendChild(mkBtn('Delete', 'del', () => { removeMarker(p.id); data.places = data.places.filter(x => x.id !== p.id); save(); }));
    div.appendChild(actions); el.appendChild(div);
  });
}

function renderCheckpoints() {
  const el = document.getElementById('list-checkpoints');
  if (!data.checkpoints.length) { el.innerHTML = '<div class="empty">No checkpoints yet.</div>'; return; }
  el.innerHTML = '';
  data.checkpoints.forEach(c => {
    const div = document.createElement('div'); div.className = 'item';
    div.innerHTML = `<div class="row"><span class="badge" style="background:var(--checkpoint)"></span>
      <span class="name">${esc(c.name)}</span></div>`;
    const actions = document.createElement('div'); actions.className = 'actions';
    actions.appendChild(mkBtn('Show', 'nav', () => focusMarker(c.id)));
    actions.appendChild(mkBtn('Directions', '', () => gmaps(null, c)));
    actions.appendChild(mkBtn('Delete', 'del', () => { removeMarker(c.id); data.checkpoints = data.checkpoints.filter(x => x.id !== c.id); save(); }));
    div.appendChild(actions); el.appendChild(div);
  });
}

function renderRoads() {
  const el = document.getElementById('list-roads');
  if (!data.roads.length) { el.innerHTML = '<div class="empty">No roads drawn. Hit “Draw road”.</div>'; return; }
  el.innerHTML = '';
  data.roads.forEach(r => {
    const div = document.createElement('div'); div.className = 'item';
    div.innerHTML = `<div class="row"><span class="badge" style="background:${r.color}"></span>
      <span class="name">${esc(r.name)}</span></div>
      <div class="meta">${r.date} · ${roadKm(r).toFixed(2)} km</div>`;
    const actions = document.createElement('div'); actions.className = 'actions';
    actions.appendChild(mkBtn('Show', 'nav', () => { map.fitBounds(roadLayers[r.id].getBounds(), { padding: [40, 40] }); }));
    actions.appendChild(mkBtn('Rename', '', () => {
      const n = prompt('Rename road:', r.name);
      if (n) { r.name = n; roadLayers[r.id].setPopupContent(`<b>${esc(n)}</b><br><span style="color:#888">${r.date} · ${roadKm(r).toFixed(2)} km</span>`); save(); }
    }));
    actions.appendChild(mkBtn('Delete', 'del', () => { roadLayers[r.id].remove(); delete roadLayers[r.id]; data.roads = data.roads.filter(x => x.id !== r.id); save(); }));
    div.appendChild(actions); el.appendChild(div);
  });
}

function mkBtn(label, cls, fn) {
  const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; return b;
}
function focusMarker(id) {
  const m = markerLayers[id];
  if (m) { map.setView(m.getLatLng(), 16); m.openPopup(); }
}
function removeMarker(id) { if (markerLayers[id]) { markerLayers[id].remove(); delete markerLayers[id]; } }

// ---------- Helpers ----------
function roadKm(road) {
  let km = 0;
  for (let i = 1; i < road.latlngs.length; i++) {
    km += map.distance(road.latlngs[i - 1], road.latlngs[i]);
  }
  return km / 1000;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function reloadAll() {
  Object.values(roadLayers).forEach(l => l.remove());
  Object.values(markerLayers).forEach(l => l.remove());
  Object.keys(roadLayers).forEach(k => delete roadLayers[k]);
  Object.keys(markerLayers).forEach(k => delete markerLayers[k]);
  data.roads.forEach(addRoadLayer);
  data.places.forEach(addPlaceLayer);
  data.checkpoints.forEach(addCheckpointLayer);
}

// ---------- Service worker (offline + instant reopen) ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// ---------- Init ----------
reloadAll();
render();
</script>
</body>
</html>
